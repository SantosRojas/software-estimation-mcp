[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "software-estimation-mcp"
version = "1.0.0"
description = "Servidor MCP para estimación PERT, cotizaciones, riesgos, cronogramas y PDFs profesionales"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Software Estimation MCP contributors"}]
keywords = ["mcp", "model-context-protocol", "estimation", "pert", "quotation", "proposal", "software"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Estimation",
  "Topic :: Utilities",
]
dependencies = [
  "fastmcp>=4.0,<5.0",
  "pydantic>=2.7,<3.0",
  "reportlab>=4.0,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.9,<1.0"]

[project.urls]
Homepage = "https://github.com/SantosRojas/software-estimation-mcp"
Repository = "https://github.com/SantosRojas/software-estimation-mcp"
Issues = "https://github.com/SantosRojas/software-estimation-mcp/issues"

[project.scripts]
software-estimation-mcp = "estimation_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "C4", "PIE", "B", "SIM"]

[tool.ruff.lint.isort]
combine-as-imports = true
